<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenMath Navbar Design Proposals</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..0" />
    <style>
        :root {
            --primary: #9d81e1; /* Example Zen Purple */
            --bg: #000000;
            --card: #080808;
            --text: #F4F4F5;
            --text-secondary: rgba(244, 244, 245, 0.5);
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 100px;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        /* --- VARIATION A: THE ZEN ISLAND --- */
        .zen-island {
            position: relative;
            background: rgba(8, 8, 8, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 15px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item .material-symbols-outlined {
            font-variation-settings: 'wght' 200, 'opsz' 24;
            font-size: 24px;
            transition: transform 0.2s ease;
        }

        .nav-item:active .material-symbols-outlined {
            transform: scale(0.85);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        .island-progress {
            position: absolute;
            bottom: 0;
            left: 30px;
            right: 30px;
            height: 2px;
            background: rgba(255,255,255,0.05);
            border-radius: 1px;
            overflow: hidden;
        }

        .island-progress-fill {
            width: 65%;
            height: 100%;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
        }

        /* --- VARIATION B: THE MINIMAL DOCK --- */
        .minimal-dock {
            width: 100%;
            background: var(--card);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 15px 0 25px 0;
            position: relative;
        }

        .dock-progress {
            position: absolute;
            top: -1px;
            left: 0;
            height: 1px;
            width: 80%;
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary);
        }

        .dock-item {
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .dock-item.active {
            color: var(--text);
        }

        .dock-label {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.6;
        }

        .dock-item.active .dock-label {
            opacity: 1;
            color: var(--primary);
        }

        /* Demo Text Backgrounds */
        .content-demo {
            height: 150px;
            background: linear-gradient(180deg, #111 0%, #000 100%);
            border-radius: 20px;
            margin-bottom: -20px;
            z-index: -1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Variation A: Zen Island</h2>
        <div class="content-demo">Content scrolling behind...</div>
        <div class="zen-island">
            <div class="nav-item">
                <span class="material-symbols-outlined">home</span>
            </div>
            <div class="nav-item active">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">analytics</span>
            </div>
            <div class="nav-item">
                <span class="material-symbols-outlined">history</span>
            </div>
            <div class="nav-item">
                <span class="material-symbols-outlined">settings</span>
            </div>
            <div class="island-progress">
                <div class="island-progress-fill"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <h2>Variation B: Minimal Dock</h2>
        <div class="minimal-dock">
            <div class="dock-progress"></div>
            <div class="dock-item">
                <span class="material-symbols-outlined">home</span>
                <span class="dock-label">Home</span>
            </div>
            <div class="dock-item active">
                <span class="material-symbols-outlined">analytics</span>
                <span class="dock-label">Stats</span>
            </div>
            <div class="dock-item">
                <span class="material-symbols-outlined">history</span>
                <span class="dock-label">Logs</span>
            </div>
            <div class="dock-item">
                <span class="material-symbols-outlined">settings</span>
                <span class="dock-label">Setup</span>
            </div>
        </div>
    </div>

    <p style="font-size: 10px; opacity: 0.3; margin-top: 50px;">
        Designed for ZenMath — Focus on clarity, depth, and micro-progress.
    </p>

</body>
</html>
